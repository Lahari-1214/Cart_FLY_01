<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cart_Fly - Register</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="auth-page">
<div class="auth-card">
    <div class="auth-logo">🛒 Cart_Fly</div><p class="auth-subtitle">Create your account</p>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
{% endwith %}

    <form method="POST" action="/user-register">
        <div class="form-group"><label>Name</label><input type="text" name="name" placeholder="Your name" required></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" placeholder="you@example.com" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" placeholder="Create a password" required></div>
        <button class="btn btn-block" type="submit">Create Account</button>
    </form>
    <p class="muted" style="text-align:center;margin-top:22px;">Already have an account? <a href="/user-login">Login</a></p>
</div>
</body>
</html>
