<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart_Fly - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
<div class="auth-card">
    <div class="auth-logo">🛒 Cart_Fly</div>
    <p class="auth-subtitle">Welcome back! Please login to continue.</p>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
{% endwith %}

    <form method="POST" action="/user-login">
        <div class="form-group"><label>Email</label><input type="email" name="email" placeholder="Enter your email" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" placeholder="Enter your password" required></div>
        <button class="btn btn-block" type="submit">Login</button>
    </form>
    <p class="muted" style="text-align:center;margin-top:22px;">Don't have an account? <a href="/user-register">Create Account</a></p>
</div>
</body>
</html>
