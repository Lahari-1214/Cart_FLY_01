<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Page</title>
</head>
<body>
    <h2>Add Delivery Address</h2>

<form method="POST">
    <input type="text" name="full_name" placeholder="Full Name" required><br><br>
    <input type="text" name="phone" placeholder="Phone Number" required><br><br>
    <input type="text" name="house" placeholder="House / Flat No" required><br><br>
    <input type="text" name="street" placeholder="Street / Area" required><br><br>
    <input type="text" name="city" placeholder="City" required><br><br>
    <input type="text" name="state" placeholder="State" required><br><br>
    <input type="text" name="pincode" placeholder="Pincode" required><br><br>

    <button type="submit">Save Address</button>
</form>

</body>
</html>
