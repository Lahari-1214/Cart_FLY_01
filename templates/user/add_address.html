<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cart_Fly - Address</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body>
<nav class="navbar"><a class="brand" href="/user-dashboard">🛒 Cart_Fly</a><div class="nav-links"><a href="/user/products">Products</a><a href="/user/cart">Cart</a><a href="/user-dashboard">Dashboard</a></div></nav>
<main class="container narrow"><div class="card"><h1 class="page-title">Delivery Address</h1><p class="page-subtitle">Where should we deliver your order?</p>
<form method="POST">
<div class="form-group"><label>Full Name</label><input name="full_name" placeholder="Full Name" required></div>
<div class="form-group"><label>Phone Number</label><input name="phone" placeholder="Phone Number" required></div>
<div class="form-group"><label>House / Flat No</label><input name="house" placeholder="House / Flat No" required></div>
<div class="form-group"><label>Street / Area</label><input name="street" placeholder="Street / Area" required></div>
<div class="form-group"><label>City</label><input name="city" placeholder="City" required></div>
<div class="form-group"><label>State</label><input name="state" placeholder="State" required></div>
<div class="form-group"><label>Pincode</label><input name="pincode" placeholder="Pincode" required></div>
<button class="btn btn-block" type="submit">Save Address</button>
</form></div></main>
</body></html>
