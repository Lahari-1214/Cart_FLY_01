<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Verify OTP</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="auth-page"><div class="auth-card"><div class="auth-logo">🔐 Verify OTP</div><p class="auth-subtitle">Complete administrator registration</p>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
{% endwith %}

<form method="POST" action="/verify-otp"><div class="form-group"><label>OTP</label><input type="text" name="otp" required></div><div class="form-group"><label>Create Password</label><input type="password" name="password" required></div><button class="btn btn-block" type="submit">Verify & Register</button></form></div></body></html>
