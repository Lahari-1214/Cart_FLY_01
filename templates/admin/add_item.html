<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Add Product - Cart_Fly</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><nav class="navbar admin-nav"><a class="brand" href="/admin-dashboard">🛒 Cart_Fly Admin</a><div class="nav-links"><a href="/admin/item-list">Products</a><a href="/admin/profile">Profile</a><a href="/admin-logout">Logout</a></div></nav>
<main class="container narrow"><div class="card"><h1 class="page-title">Add New Product</h1>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
{% endwith %}

<form method="POST" action="/admin/add-item" enctype="multipart/form-data">
<div class="form-group"><label>Product Name</label><input name="name" required></div><div class="form-group"><label>Description</label><textarea name="description" required></textarea></div><div class="form-group"><label>Category</label><input name="category" required></div><div class="form-group"><label>Price</label><input type="number" step="0.01" name="price" required></div><div class="form-group"><label>Product Image</label><input type="file" name="image" accept="image/*" required></div>
<button class="btn" type="submit">Add Product</button> <a class="btn btn-secondary" href="/admin/item-list">Cancel</a>
</form></div></main></body></html>
