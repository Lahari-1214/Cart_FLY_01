<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Profile - Cart_Fly</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><nav class="navbar admin-nav"><a class="brand" href="/admin-dashboard">🛒 Cart_Fly Admin</a><div class="nav-links"><a href="/admin/item-list">Products</a><a href="/admin-dashboard">Dashboard</a><a href="/admin-logout">Logout</a></div></nav>
<main class="container narrow"><div class="card"><h1 class="page-title">Admin Profile</h1>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
{% endwith %}

<div style="text-align:center;">{% if admin.profile_image %}<img class="profile-img" src="/static/uploads/admin_profiles/{{ admin.profile_image }}">{% else %}<div class="profile-img" style="display:grid;place-items:center;background:#eff6ff;margin-left:auto;margin-right:auto;">👤</div>{% endif %}</div>
<form method="POST" action="/admin/profile" enctype="multipart/form-data">
<div class="form-group"><label>Name</label><input name="name" value="{{ admin.name }}" required></div><div class="form-group"><label>Email</label><input type="email" name="email" value="{{ admin.email }}" required></div><div class="form-group"><label>New Password (optional)</label><input type="password" name="password"></div><div class="form-group"><label>New Profile Image (optional)</label><input type="file" name="profile_image" accept="image/*"></div>
<button class="btn" type="submit">Update Profile</button> <a class="btn btn-secondary" href="/admin-dashboard">Back</a>
</form></div></main></body></html>
